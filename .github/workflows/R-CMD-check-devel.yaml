# R CMD check on R-devel, weekly and on demand (Actions > R-CMD-check-devel.yaml
# > Run workflow). It is not run on every push: R-devel has no binary packages,
# so all dependencies compile from source (about 18 minutes), and the package
# cache never hits because its key includes R-devel's build id. win-builder
# also checks R-devel before each CRAN submission.
# Derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays, 09:17 UTC
  workflow_dispatch:

name: R-CMD-check-devel.yaml

permissions: read-all

jobs:
  R-CMD-check-devel:
    runs-on: ubuntu-latest
    name: ubuntu-latest (devel)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
