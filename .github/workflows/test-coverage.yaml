# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# spDBL changes to the template:
# * SPDBL_RUN_STAN_TESTS=true, so coverage includes the RStan calibration
#   integration tests (they are skipped in R-CMD-check and on CRAN).
# * The coverage total and per-file table go to the job summary.
# * The Codecov upload runs only when the CODECOV_TOKEN secret is set.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SPDBL_RUN_STAN_TESTS: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::rstan
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
          df <- as.data.frame(cov)
          by_file <- sort(tapply(df$value > 0, df$filename, mean))
          lines <- c(
            sprintf("## Test coverage: %.1f%%", covr::percent_coverage(cov)),
            "", "| File | Coverage |", "|---|---|",
            sprintf("| `%s` | %.1f%% |", names(by_file), 100 * by_file))
          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary_file)) writeLines(lines, summary_file)
        shell: Rscript {0}

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
